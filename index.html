<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maritimt DS – komponenter</title>
<style>
  :root {
    --bg: #ffffff; --fg: #1f1f1f; --muted: #6b6b6b; --line: #e3e3e3;
    --accent: #2d548b; --on-accent: #ffffff; --ok: #2e7d32; --err: #c62828; --card: #f6f6f6;
  }
  :root[data-theme="dark"] {
    --bg: #18191b; --fg: #eeeeee; --muted: #a0a0a0; --line: #2f3033;
    --accent: #6f9ad6; --on-accent: #0d1a2b; --ok: #81c784; --err: #ef9a9a; --card: #222326;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg);
         font: 13px/1.5 "Work Sans", system-ui, sans-serif; }
  h1 { font-size: 15px; margin: 0 0 2px; }
  p { margin: 0 0 12px; color: var(--muted); }
  .status { padding: 10px 12px; border-radius: 6px; background: var(--card); border: 1px solid var(--line); margin-bottom: 8px; }
  .status.ok { border-color: var(--ok); }
  .status.feil { border-color: var(--err); }
  .komp { display: flex; align-items: center; justify-content: space-between; gap: 8px;
          padding: 8px 0; border-top: 1px solid var(--line); }
  .komp small { display: block; color: var(--muted); }
  .komp .hake { color: var(--ok); margin-left: 4px; }
  button { font: inherit; font-weight: 600; border: 1px solid var(--accent); border-radius: 6px; padding: 6px 12px;
           background: transparent; color: var(--accent); cursor: pointer; min-height: 32px; flex-shrink: 0; }
  button.hoved { background: var(--accent); color: var(--on-accent); width: 100%; margin: 4px 0 8px; min-height: 36px; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  #logg { margin-top: 8px; max-height: 150px; overflow: auto; font-size: 12px; color: var(--muted);
          border-top: 1px solid var(--line); padding-top: 8px; }
  #logg .feil { color: var(--err); }
  #logg .ok { color: var(--ok); }
  .versjon { color: var(--muted); font-size: 11px; margin-top: 8px; }
</style>
</head>
<body>
  <h1>Maritimt DS – komponenter</h1>
  <p>OpenBridge-regler, Designsystemet-struktur. Alt bindes til tokens, så palett og størrelse kan byttes etterpå.</p>

  <div id="status" class="status">Sjekker tokens …</div>
  <button id="alle" class="hoved" disabled>Generer alle</button>
  <div id="liste"></div>

  <div id="logg"></div>
  <div class="versjon" id="versjon"></div>

<script>
  const $ = (id) => document.getElementById(id);
  const params = new URLSearchParams(location.hash.split('?')[1] || location.search);
  document.documentElement.dataset.theme = params.get('theme') === 'dark' ? 'dark' : 'light';
  let klar = false;

  function logg(tekst, klasse = '') {
    const el = document.createElement('div');
    el.textContent = tekst;
    if (klasse) el.className = klasse;
    $('logg').appendChild(el);
    $('logg').scrollTop = $('logg').scrollHeight;
  }
  function laas(av) {
    document.querySelectorAll('button').forEach((b) => (b.disabled = av || !klar));
  }
  function generer(id) {
    laas(true);
    logg(id === 'alle' ? 'Genererer alle komponenter …' : 'Genererer …');
    parent.postMessage({ type: 'generer', komponent: id }, '*');
  }

  window.addEventListener('message', (e) => {
    const m = e.data;
    if (!m || typeof m !== 'object') return;
    if (m.type === 'tema') document.documentElement.dataset.theme = m.tema === 'dark' ? 'dark' : 'light';
    if (m.type === 'status') {
      klar = !!m.ok;
      $('status').textContent = m.melding;
      $('status').className = 'status ' + (m.ok ? 'ok' : 'feil');
      $('versjon').textContent = 'Versjon ' + m.versjon;
      $('liste').innerHTML = '';
      for (const k of m.komponenter || []) {
        const rad = document.createElement('div');
        rad.className = 'komp';
        const info = document.createElement('div');
        const navn = document.createElement('strong');
        navn.textContent = k.navn;
        navn.id = 'navn-' + k.id;
        const detaljer = document.createElement('small');
        detaljer.textContent = `${k.antall} varianter · ${k.egenskaper.join(' × ')}`;
        info.append(navn, detaljer);
        const knapp = document.createElement('button');
        knapp.textContent = 'Generer';
        knapp.addEventListener('click', () => generer(k.id));
        rad.append(info, knapp);
        $('liste').appendChild(rad);
      }
      laas(false);
    }
    if (m.type === 'logg') logg(m.tekst, m.nivaa === 'feil' ? 'feil' : '');
    if (m.type === 'ferdig') {
      logg(`${m.navn}: ${m.antall} varianter` + (m.feil ? `, ${m.feil} koblinger feilet` : ' ✓'), m.feil ? 'feil' : 'ok');
      const n = $('navn-' + m.id);
      if (n && !n.querySelector('.hake')) n.insertAdjacentHTML('beforeend', '<span class="hake">✓</span>');
    }
    if (m.type === 'alt-ferdig') laas(false);
    if (m.type === 'feil') {
      logg('Feil: ' + m.tekst, 'feil');
      laas(false);
    }
  });

  $('alle').addEventListener('click', () => generer('alle'));
  parent.postMessage({ type: 'klar' }, '*');
</script>
</body>
</html>
